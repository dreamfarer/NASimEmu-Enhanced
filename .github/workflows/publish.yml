# Based on uv's official trusted-publishing example:
# https://docs.astral.sh/uv/guides/integration/github/#publishing-to-pypi
name: "Publish release to PyPI"

on:
  push:
    tags:
      # Publish on version tags, e.g. v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Check tag matches project version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      # gym 0.21.0 has invalid metadata that uv and pip >= 24.1 reject, so the
      # smoke tests install with legacy pip/setuptools until gym is dropped.
      - name: Smoke test (wheel and source distribution)
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            rm -rf .smoke-venv
            uv venv --python 3.10 --seed .smoke-venv
            .smoke-venv/bin/python -m pip install "pip<24.1" "setuptools<66" "wheel<0.40" hatchling
            .smoke-venv/bin/python -m pip install --no-build-isolation "$dist"
            .smoke-venv/bin/python -c "import nasimemu.env"
          done

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nasimemu-enhanced/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish
