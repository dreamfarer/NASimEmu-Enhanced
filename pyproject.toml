[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nasimemu-enhanced"
version = "1.0.0"
authors = [
    {name="Jaromir Janisch", email="author@jaromiru.com"}
]
maintainers = [
    {name="dreamfarer"}
]
description = "Gym based environment for training offensive RL agents in simulated and emulated computer networks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.11"
dependencies = [
    "gym == 0.21.0",
    "networkx", # For nasim render
    "prettytable", # For nasim render
    "matplotlib", # For nasim render (suppress warning)
    "pyyaml", # For nasim
    "msgpack", # For pymetasploit3
    "requests", # For pymetasploit3
    "urllib3", # For pymetasploit3
    "retry", # For pymetasploit3
    "pillow", # For nasim_problem rendering
    "plotly", # For nasim_problem debug
    "scipy", # For networkx
    # "pygame", # For nasim play
    # "kaleido", # Image with plotly for nasim play
]

[project.urls]
Homepage = "https://github.com/dreamfarer/NASimEmu-Enhanced"
Repository = "https://github.com/dreamfarer/NASimEmu-Enhanced"
Upstream = "https://github.com/jaromiru/NASimEmu"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/nasimemu"]

[tool.mypy]
python_version = "3.10"
files = ["src/nasimemu"]

# Packages that are neither installed in the isolated pre-commit environment
# nor available as stubs.
[[tool.mypy.overrides]]
module = ["gym.*", "torch.*", "matplotlib.*", "plotly.*", "prettytable.*", "msgpack.*"]
ignore_missing_imports = true
