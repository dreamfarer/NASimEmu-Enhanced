[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nasimemu-enhanced"
dynamic = ["version"]
authors = [
    {name="Jaromir Janisch", email="author@jaromiru.com"}
]
maintainers = [
    {name="dreamfarer"}
]
description = "Gymnasium based environment for training offensive RL agents in simulated and emulated computer networks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "gymnasium==1.3",
    "networkx", # For graph.plot_network
    "prettytable", # For simulation.render
    "pyyaml", # For scenarios yaml loading
    "pymetasploit3 == 1.0.6", # Metasploit RPC client for emulation
    "requests", # For emulation.msf_client shared session
    "retry", # For emulation.msf_client shared session
    "plotly", # For graph network plotting
    "scipy", # For networkx
    "numpy==2.2.6",
]

[project.optional-dependencies]
# Drive the environment from another process, language or machine over
# dm_env_rpc (gRPC). Only needed for nasimemu_enhanced.network.
network = [
    "dm-env-rpc >= 1.1.7",
]

[project.scripts]
nasimemu-server = "nasimemu_enhanced.network.server:main"

[project.urls]
Homepage = "https://github.com/dreamfarer/NASimEmu-Enhanced"
Repository = "https://github.com/dreamfarer/NASimEmu-Enhanced"
Upstream = "https://github.com/jaromiru/NASimEmu"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/nasimemu_enhanced"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/nasimemu_enhanced"]

[[tool.mypy.overrides]]
module = ["plotly.*", "prettytable.*", "pymetasploit3.*", "grpc", "grpc.*", "dm_env_rpc.*", "google.rpc.*"]
ignore_missing_imports = true
